plugins {
    id 'java'
}

group = 'com.github.falledcan'
version = '1.1.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.140-beta'
}

java {
    // Paper 26.x API is published for Java 25, so compile with a Java 25 toolchain...
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // ...but emit Java 17 bytecode so the jar also runs on older servers (1.18+).
    options.release = 17
}

configurations.named('compileClasspath') {
    // Let Gradle hand the Java 25 Paper API to the Java 17 compile above.
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
