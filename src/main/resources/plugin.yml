name: Simple_AFK_Room
version: '${version}'
main: com.github.falledcan.simple_afk_room.Simple_AFK_Room
api-version: '1.18'
authors: [ FalledCan ]
description: Teleports idle players to an AFK room and brings them back when they move.
commands:
  afkroom:
    description: Manage the AFK room.
    usage: /afkroom <set|tp|time|reload>
    permission: afkroom.admin
permissions:
  afkroom.admin:
    description: Allows using /afkroom.
    default: op
  afkroom.bypass:
    description: Never sent to the AFK room.
    default: false
